<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>飞龙娱乐 · 运营后台</title>
<style>
:root{
  --blue:#2b7ff5; --blue-d:#1466d6; --blue-l:#eaf3ff;
  --red:#ff3b30; --green:#12b76a; --orange:#ff8a00;
  --bg:#f2f5fa; --card:#fff; --txt:#26313f; --sub:#8b98ad; --line:#eef1f6;
  --sh:0 2px 10px rgba(43,127,245,.08);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);max-width:1240px;margin:0 auto;padding-bottom:40px}
.hd{display:flex;align-items:center;gap:14px;padding:14px 20px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
.hd b{font-size:17px;color:var(--txt);letter-spacing:.3px}
.hd b::before{content:"";display:inline-block;width:4px;height:16px;border-radius:2px;
  background:linear-gradient(180deg,#4aa3ff,#1466d6);margin-right:9px;vertical-align:-2px}
.sp{flex:1}
.tabs{display:flex;gap:7px;padding:12px 20px;background:#fff;overflow:auto;
  border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 15px;border-radius:9px;background:#f1f4f9;color:#5d6c80;cursor:pointer;
  white-space:nowrap;font-size:13.5px;transition:.15s}
.tab:hover{background:#e8eef8}
.tab.on{background:linear-gradient(135deg,#4aa3ff,#1466d6);color:#fff;font-weight:600;
  box-shadow:0 3px 10px rgba(20,102,214,.28)}
main{padding:16px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:#fff;border-radius:14px;padding:15px 16px;box-shadow:var(--sh);
  border-left:3px solid var(--blue)}
.kpi .l{color:var(--sub);font-size:12px}
.kpi .v{font-size:22px;font-weight:800;color:var(--blue);margin-top:3px;letter-spacing:.3px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;
  overflow:hidden;font-size:13px;box-shadow:var(--sh)}
th{background:#f7f9fc;color:#7b8ba0;text-align:left;padding:10px 12px;font-weight:600;
  white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-top:1px solid #f3f6fa;white-space:nowrap}
tbody tr:hover td{background:#f8fbff}
input,select,button{font:inherit}
input,select{background:#f4f7fb;border:1px solid #e8eef7;color:var(--txt);border-radius:9px;
  padding:8px 11px;outline:none}
input:focus,select:focus{border-color:#a9cdfb;background:#fff}
button{background:#f1f4f9;color:#41536b;border:0;border-radius:9px;padding:8px 15px;
  cursor:pointer;transition:transform .1s,filter .1s;font-weight:600}
button:active{transform:scale(.96);filter:brightness(.96)}
button.p{background:linear-gradient(135deg,#4aa3ff,#1466d6);color:#fff;
  box-shadow:0 3px 10px rgba(20,102,214,.26)}
button.d{background:linear-gradient(135deg,#ff6b5a,#e6312a);color:#fff;
  box-shadow:0 3px 10px rgba(230,49,42,.22)}
button.g{background:linear-gradient(135deg,#2ed48a,#12b76a);color:#fff;
  box-shadow:0 3px 10px rgba(18,183,106,.22)}
.box{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--sh)}
.box h3{margin:0 0 13px;font-size:15px;color:var(--txt);display:flex;align-items:center;gap:8px}
.box h3::before{content:"";width:3px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,#4aa3ff,#1466d6)}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.lbl{color:var(--sub);font-size:12px}
.pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#33455c;white-space:pre-wrap;
  background:#f7f9fc;border-radius:10px;padding:12px;font-size:12.5px;line-height:1.7}
.mask{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;
  justify-content:center;z-index:99;backdrop-filter:blur(2px)}
.mask.on{display:flex}
.modal{background:#fff;padding:24px;border-radius:18px;width:360px;box-shadow:0 20px 50px rgba(20,40,70,.22)}
.modal h3{margin-top:0;font-size:16px}
.modal input{width:100%;margin-bottom:12px}
textarea{background:#f7f9fc!important;border:1px solid #e8eef7!important;border-radius:10px!important;
  color:#33455c!important;font-family:ui-monospace,monospace!important;outline:none}
textarea:focus{border-color:#a9cdfb!important;background:#fff!important}
</style>
<style id="scope-style">
.scopebar{display:flex;gap:6px}
.scopebar button{
  padding:5px 14px;
  border-radius:8px;
  border:1px solid #e2e9f5;
  background:#fff;
  color:#5a6b8a;
  font-size:12.5px;
  font-weight:700;
  cursor:pointer;
  transition:all .15s;
}
.scopebar button:hover{background:#f4f7ff;border-color:#cfdcf0}
.scopebar button.on{
  background:linear-gradient(135deg,#5b6fa8,#414a65);
  color:#fff;
  border-color:transparent;
  box-shadow:0 2px 8px rgba(65,74,101,.22);
}
</style>
</head><body>
<div class="hd"><b>飞龙娱乐 · 运营后台</b><div class="sp"></div>
<span class="lbl" id="st">未登录</span><button id="hdBtn" onclick="openLogin()">登录</button></div>
<div style="display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;background:#fff;border-radius:10px;border:1px solid #e6ecf6">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#5b6fa8" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  <span style="font-size:13px;font-weight:700;color:#2b3d5c">数据范围</span>
  <div class="scopebar" id="scopeBar">
    <button data-scope="all" class="on">全部</button>
    <button data-scope="real">真人</button>
    <button data-scope="bot">机器人</button>
  </div>
  <div style="flex:1"></div>
  <span id="scopeHint" style="font-size:11.5px;color:#8b9ab0"></span>
</div>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<div class="mask" id="mask"><div class="modal"><h3 style="margin-top:0">管理员登录</h3>
<input id="ap" type="password" placeholder="管理密码">
<div style="display:flex;gap:8px;margin-bottom:12px">
  <input id="ac" placeholder="验证码" maxlength="4" style="flex:1;margin:0;letter-spacing:3px;text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
  <img id="acap" onclick="refreshCAP()" title="点击换一张" alt="验证码"
    onerror="this.style.display='none';document.getElementById('acapErr').style.display='flex'"
    onload="this.style.display='block';document.getElementById('acapErr').style.display='none'"
    style="width:118px;height:40px;border-radius:9px;cursor:pointer;border:1px solid #e8eef7;background:#f7f9fc;object-fit:contain">
  <div id="acapErr" onclick="refreshCAP()"
    style="display:none;width:118px;height:40px;border-radius:9px;cursor:pointer;
    border:1px dashed #d6dfec;background:#f7f9fc;color:#8b98ad;font-size:12px;
    align-items:center;justify-content:center">点我刷新</div>
</div>
<button class="p" style="width:100%;padding:11px 0" onclick="doLogin()">进入</button></div></div>

<script>
// 数据范围切换
document.addEventListener('DOMContentLoaded', function(){
  const bar = document.getElementById('scopeBar');
  if(bar){
    bar.querySelectorAll('button').forEach(b=>{
      b.onclick = () => setScope(b.dataset.scope);
    });
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.scope === ADMIN_SCOPE));
  }
  const h = document.getElementById('scopeHint');
  if(h) h.textContent = ADMIN_SCOPE === 'real' ? '只看真人玩家数据' : ADMIN_SCOPE === 'bot' ? '只看机器人数据' : '全部玩家（含机器人）';
});

const $=id=>document.getElementById(id);
let T=localStorage.atoken||'', TAB='report', LOTS={}, CAPID='';
const H={Authorization:'Bearer '+T,'Content-Type':'application/json'};
async function api(p,b,m){
  // 自动给后台查询接口带上数据范围
  try{
    if(p.indexOf('/api/admin/') === 0
       && p.indexOf('/login') < 0
       && p.indexOf('/confirm') < 0
       && p.indexOf('/delete') < 0
       && p.indexOf('/adjust') < 0
       && p.indexOf('/reset') < 0
       && p.indexOf('/note') < 0
       && p.indexOf('/ctrl') < 0
       && p.indexOf('scope=') < 0){
      const sc = localStorage.getItem('adminScope');
      if(sc && sc !== 'all'){
        p += (p.indexOf('?') >= 0 ? '&' : '?') + 'scope=' + sc;
      }
    }
  }catch(e){}
  const h={'Content-Type':'application/json'};if(T)h.Authorization='Bearer '+T;
  const r=await fetch(p,{method:m||(b?'POST':'GET'),headers:h,body:b?JSON.stringify(b):undefined});
  const j=await r.json();
  if(j.code!==0)throw new Error(j.msg);
  return j.data;
}
function openLogin(){$('mask').classList.add('on'); refreshCAP();}
async function refreshCAP(){
  const im=document.getElementById('acap'), er=document.getElementById('acapErr');
  try{
    const r=await fetch('/api/captcha'); const j=await r.json();
    if(j.code!==0) throw new Error(j.msg||'获取失败');
    CAPID=j.data.id;
    if(im){ im.src=j.data.img; im.style.display='block'; }
    if(er) er.style.display='none';
  }catch(e){
    if(im) im.style.display='none';
    if(er) er.style.display='flex';
  }
}
async function doLogin(){
  const c=(document.getElementById('ac')||{}).value||'';
  if(String(c).trim().length<4){ alert('请输入验证码'); return; }
  try{
    const d=await api('/api/admin/login',{pwd:$('ap').value,captcha_id:CAPID,captcha_code:String(c).trim()});
    T=d.token;localStorage.atoken=T;$('mask').classList.remove('on');$('st').textContent='已登录';
    boot();
  }catch(e){alert(e.message); refreshCAP(); if(document.getElementById('ac'))document.getElementById('ac').value='';}
}
let ADMIN_SCOPE = localStorage.getItem('adminScope') || 'all';
function scopeQS(){
  return (ADMIN_SCOPE && ADMIN_SCOPE !== 'all') ? ('scope=' + ADMIN_SCOPE) : '';
}
function withScope(url){
  const q = scopeQS();
  if(!q) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + q;
}
function setScope(v){
  ADMIN_SCOPE = v;
  localStorage.setItem('adminScope', v);
  document.querySelectorAll('#scopeBar button').forEach(function(b){
    b.classList.toggle('on', b.dataset.scope === v);
  });
  const h = document.getElementById('scopeHint');
  if(h) h.textContent = v === 'real' ? '只看真人玩家数据' : v === 'bot' ? '只看机器人数据' : '全部玩家（含机器人）';
  try { go(TAB); } catch(e) {}
}
const TABS={report:'数据看板',draw:'开奖管理',src:'开奖源',bot:'机器人',poker:'牌局',
  ctrl:'会员控制',users:'会员',pay:'充值订单',bets:'注单',agent:'代理',wd:'提现审核',rank:'连中榜',
  risk:'风控',odds:'赔率配置'};
function renderTabs(){
  $('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>
    `<div class="tab ${k===TAB?'on':''}" onclick="go('${k}')">${v}</div>`).join('');
}
function go(k){TAB=k;renderTabs();render();}

async function boot(){
  $('st').textContent=T?'已登录':'未登录';
  const hb=$('hdBtn');
  if(T && hb){
    hb.textContent='退出登录';
    hb.onclick=async ()=>{
      try{ await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json',
             'Authorization':'Bearer '+T},body:'{}'}); }catch(e){}
      localStorage.removeItem('atoken'); T=''; $('st').textContent='未登录';
      hb.textContent='登录'; hb.onclick=openLogin;
      $('main').innerHTML='<div class="box"><h3>已退出</h3><div class="lbl">点右上角重新登录</div></div>';
      renderTabs(); openLogin();
    };
  }
  try{LOTS=Object.fromEntries((await api('/api/lots')).map(l=>[l.lot,l]));}catch(e){}
  renderTabs();render();
  setInterval(()=>{if(TAB==='report')render()},20000);
}

async function render(){
  const m=$('main');
  try{
    if(TAB==='report'){
      const r=await api('/api/admin/report');
      m.innerHTML=`<div class="kpis">
        <div class="kpi"><div class="l">今日投注</div><div class="v">￥${r.today.bet_amount}</div></div>
        <div class="kpi"><div class="l">今日派彩</div><div class="v">￥${r.today.payout}</div></div>
        <div class="kpi"><div class="l">今日盈亏</div><div class="v" style="color:${r.today.profit>=0?'#12b76a':'#e6312a'}">￥${r.today.profit}</div></div>
        <div class="kpi"><div class="l">今日注单</div><div class="v">${r.today.bets}</div></div>
        <div class="kpi"><div class="l">今日新会员</div><div class="v">${r.today.new_users}</div></div>
        <div class="kpi"><div class="l">总会员</div><div class="v">${r.total_users}</div></div>
        <div class="kpi"><div class="l">会员总余额</div><div class="v">￥${r.user_balance}</div></div>
        <div class="kpi"><div class="l">待审提现</div><div class="v">${r.pending_withdraw.count} / ￥${r.pending_withdraw.amount}</div></div>
      </div>
      <div class="box" style="margin-top:16px"><h3>今日风控命中</h3>
        ${r.risk.length?r.risk.map(x=>`<div class="pre">${x.kind} × ${x.n}</div>`).join(''):'<span class="lbl">无</span>'}</div>`;

    }else if(TAB==='draw'){
      m.innerHTML=`<div class="box"><h3>预设开奖（可控盘）</h3>
        <div class="row">
          <select id="dlot">${Object.entries(LOTS).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select>
          <input id="diss" placeholder="期号，留空=自动取当前期" style="width:220px">
          <input id="dnums" placeholder="开奖号码 5 位，如 78319" style="width:200px">
          <button class="p" onclick="doPreset()">预设</button>
          <button class="g" onclick="doDraw()">立即开奖</button>
        </div>
        <div class="lbl">预设后由定时器到点开奖即生效；立即开奖会按预设号结算，无预设则随机。</div>
      </div>
      <div class="box"><h3>最近开奖</h3><div id="drawList" class="pre">加载中…</div></div>`;
      loadDraws();

    }else if(TAB==='users'){
      const ds=await api('/api/admin/users?n=100');
      m.innerHTML=`<div class="box"><div class="row" style="align-items:center;margin-bottom:10px">
        <h3 style="margin:0">会员（最近 100）</h3><span style="flex:1"></span>
        <input id="memSearch" placeholder="输入账号查找" style="width:150px;margin:0">
        <button class="p sm" onclick="searchMember()">查找</button>
        <input id="memNoteFilter" placeholder="备注筛选" style="width:110px;margin:0">
        <button class="sm" onclick="filterByNote()">筛选</button>
        <button class="sm" onclick="exportMembers()">导出 CSV</button>
      </div><table>
        <tr><th>账号</th><th>VIP</th><th>余额</th><th>冻结</th><th>代理</th><th>状态</th><th>注册IP</th><th>注册时间</th><th>操作</th></tr>
        ${ds.map(u=>`<tr><td>${u.uid}</td>
          <td>${(u.vip||0)>0?`<b style="color:#ff8a00">VIP${u.vip}</b>`:'<span class="lbl">-</span>'}</td>
          <td>${Number(u.balance).toFixed(2)}</td>
          <td>${Number(u.frozen).toFixed(2)}</td><td>${u.agent||'-'}</td>
          <td>${u.status===1?'正常':'冻结'}</td><td>${u.reg_ip||'-'}</td>
          <td>${new Date(u.ctime*1000).toLocaleString()}</td>
          <td><button onclick="togUser('${u.uid}',${u.status===1?0:1})">${u.status===1?'冻结':'解冻'}</button>
              <button onclick="goCtrl('${u.uid}')">控制</button>
              <button class="p" onclick="showMember('${u.uid}')">详情</button></td></tr>`).join('')}
      </table></div>`;

    }else if(TAB==='pay'){
      const st = $('payFilter')?.value ?? '';
      const kw = $('payUid')?.value ?? '';
      const ds = await api('/api/admin/payments?n=100&status='+st+'&uid='+encodeURIComponent(kw));
      const statusTxt = {0:'待支付',1:'已到账',2:'已取消'};
      m.innerHTML=`<div class="box"><div class="row" style="align-items:center;margin-bottom:10px">
        <h3 style="margin:0">充值订单（${ds.length}）</h3><span style="flex:1"></span>
        <select id="payFilter" style="width:110px"><option value="">全部状态</option>
          <option value="0">待支付</option><option value="1">已到账</option></select>
        <input id="payUid" placeholder="账号" style="width:120px;margin:0">
        <button class="p sm" onclick="render()">查询</button>
        <button class="sm" onclick="showDeletedPay()">已删除</button>
        <button class="sm" onclick="showPayAudit()">操作审计</button>
      </div>
      <table><tr><th>订单号</th><th>会员</th><th>金额</th><th>渠道</th><th>状态</th><th>创建时间</th><th>到账时间</th><th>操作</th></tr>
        ${ds.length?ds.map(p=>`<tr>
          <td class="lbl">${p.order_no}</td>
          <td><b style="color:#2b7ff5;cursor:pointer;text-decoration:underline" onclick="showMember('${p.uid}')">${p.uid}</b></td>
          <td style="color:#12b76a;font-weight:700">${p.amount.toFixed(2)}</td>
          <td class="lbl">${p.channel||'-'}</td>
          <td>${p.status===1?'<span style="color:#12b76a">已到账</span>':p.status===0?'<span style="color:#c77900">待支付</span>':'<span class="lbl">已取消</span>'}</td>
          <td class="lbl">${new Date(p.ctime*1000).toLocaleString('zh-CN')}</td>
          <td class="lbl">${p.ptime?new Date(p.ptime*1000).toLocaleString('zh-CN'):'-'}</td>
          <td>
            ${p.status===0?`<button class="p sm" onclick="confirmPay('${p.order_no}')">补单</button>`:''}
            ${p.status===1
              ? `<button class="d sm" onclick="delPay('${p.order_no}',1)">删除+扣回</button>
                 <button class="sm" onclick="delPay('${p.order_no}',0)">只删记录</button>`
              : `<button class="d sm" onclick="delPay('${p.order_no}',0)">删除</button>`}
            <button class="sm" onclick="showPayLogs('${p.order_no}')">日志</button>
          </td></tr>`).join(''):'<tr><td colspan=8 class="lbl">暂无充值订单</td></tr>'}
      </table></div>`;

    }else if(TAB==='bets'){
      const ds=await api(withScope('/api/admin/bets?n=100'));
      m.innerHTML=`<div class="box"><h3>注单（最近 100）</h3><table>
        <tr><th>订单号</th><th>会员</th><th>彩种/期号</th><th>玩法</th><th>号码</th><th>注数</th>
        <th>金额</th><th>派彩</th><th>状态</th></tr>
        ${ds.map(b=>`<tr><td>${b.order_no}</td><td>${b.uid}</td><td>${b.lot} ${b.issue}</td>
          <td>${b.play}${b.extra?'/'+b.extra:''}</td><td>${fmtCodes(b.codes)}</td><td>${b.bets_count}</td>
          <td>${Number(b.amount).toFixed(2)}</td><td style="color:${b.win>0?'#12b76a':'#8b98ad'}">${Number(b.win).toFixed(2)}</td>
          <td>${b.status===0?'待开':b.status===1?'未中':'中奖'}</td></tr>`).join('')}
      </table></div>`;

    }else if(TAB==='agent'){
      const ds=await api('/api/admin/agents');
      m.innerHTML=`<div class="box"><h3>新建代理</h3><div class="row">
        <input id="acode" placeholder="代理编号（同时是登录账号）">
        <input id="aname" placeholder="名称">
        <input id="arate" type="number" step="0.001" value="0.012" style="width:110px" placeholder="返点">
        <input id="aparent" placeholder="上级代理编号（选填）">
        <button class="p" onclick="newAgent()">创建</button></div>
        <div class="lbl">默认密码 agent123456，登录后可在前台看到返点余额</div></div>
      <div class="box"><h3>代理列表</h3><table>
        <tr><th>编号</th><th>名称</th><th>返点</th><th>上级</th><th>层级</th><th>创建时间</th></tr>
        ${ds.map(a=>`<tr><td>${a.code}</td><td>${a.name||'-'}</td><td>${(a.rate*100).toFixed(2)}%</td>
          <td>${a.parent||'-'}</td><td>L${a.level}</td><td>${new Date(a.ctime*1000).toLocaleString()}</td></tr>`).join('')}
      </table></div>`;

    }else if(TAB==='wd'){
      const ds=await api('/api/admin/withdraws?status=0');
      m.innerHTML=`<div class="box"><h3>待审提现（${ds.length}）</h3><table>
        <tr><th>ID</th><th>会员</th><th>申请</th><th>手续费</th><th>实付</th><th>收款信息</th><th>时间</th><th>操作</th></tr>
        ${ds.length?ds.map(w=>`<tr><td>${w.id}</td><td>${w.uid}</td><td>${Number(w.amount).toFixed(2)}</td>

// CSV 导出（通用）
function exportCsv(filename, rows){
  const esc = (v) => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = '\ufeff' + rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}

async function showPokerPlayer(uid){
  try{
    const d = await api('/api/admin/poker/player?uid='+encodeURIComponent(uid));
    // 7 天盈亏折线图
    const vals = d.trend.map(t=>t.v);
    const W = 360, H = 90, PAD = 10;
    const maxAbs = Math.max(10, ...vals.map(Math.abs));
    const stepX = (W - PAD*2) / Math.max(1, vals.length - 1);
    const y0 = H/2;
    const pts = vals.map((v,i)=>[PAD + i*stepX, y0 - (v/maxAbs)*(y0-6)]);
    const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const dots = pts.map((p,i)=>{
      const v = vals[i];
      return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${v>=0?'#12b76a':'#e6413c'}"/>`;
    }).join('');
    const labels = d.trend.map((t,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${H-1}" font-size="9" fill="#8b98ad" text-anchor="middle">${t.d.slice(3)}</text>`).join('');
    const vals_txt = d.trend.map(t=>`<b style="color:${t.v>=0?'#12b76a':'#e6413c'}">${t.v>=0?'+':''}${t.v.toFixed(0)}</b>`).join(' · ');
    const trend = `<svg width="${W}" height="${H}" style="display:block;margin:0 auto">
      <line x1="${PAD}" y1="${y0}" x2="${W-PAD}" y2="${y0}" stroke="#e8eef7" stroke-width="1" stroke-dasharray="3,3"/>
      <path d="${path}" fill="none" stroke="#2b7ff5" stroke-width="2" stroke-linejoin="round"/>
      ${dots}${labels}
    </svg><div style="text-align:center;font-size:12px;margin-top:2px">${vals_txt}</div>`;
    const flows = d.flows.slice(0,10).map(f=>`<tr><td>${f.kind}</td>
      <td style="color:${f.amount>=0?'#12b76a':'#e6413c'}">${f.amount>=0?'+':''}${f.amount.toFixed(2)}</td>
      <td class="lbl">${f.memo||''}</td>
      <td class="lbl">${new Date(f.ctime*1000).toLocaleString('zh-CN')}</td></tr>`).join('');
    const rooms = d.rooms.length ? d.rooms.map(r=>`<span class="pre">${r.code}</span>`).join(' ') : '<span class="lbl">当前不在任何房间</span>';
    const m = document.querySelector('#mask .modal');
    m.style.maxHeight = '72vh'; m.style.overflowY = 'auto';
    m.innerHTML=`<h3>玩家详情 · ${uid} <span style="font-size:12px;color:#8b98ad;cursor:pointer;float:right" onclick="$('mask').classList.remove('on')">✕</span></h3>
      <div class="box" style="margin:0 0 12px"><div class="row" style="gap:20px;justify-content:center">
        <div style="text-align:center"><div class="lbl">中心</div><b style="font-size:16px">${d.wallet.center.toFixed(2)}</b></div>
        <div style="text-align:center"><div class="lbl">棋牌</div><b style="font-size:16px;color:#7c3aed">${d.wallet.poker.toFixed(2)}</b></div>
        <div style="text-align:center"><div class="lbl">彩票</div><b style="font-size:16px;color:#0f9f5f">${d.wallet.lot.toFixed(2)}</b></div>
        <div style="text-align:center"><div class="lbl">今日盈亏</div><b style="font-size:16px;color:${d.pnl.pnl>=0?'#12b76a':'#e6413c'}">${d.pnl.pnl>=0?'+':''}${d.pnl.pnl.toFixed(2)}</b></div>
      </div></div>
      <div class="lbl" style="margin:8px 0 4px">近 7 天盈亏</div>
      <div style="text-align:center;margin-bottom:12px">${trend}</div>
      <div class="lbl" style="margin:8px 0 4px">当前房间</div><div style="margin-bottom:12px">${rooms}</div>
      <div class="lbl" style="margin:8px 0 4px">最近流水</div>
      <table><tr><th>类型</th><th>金额</th><th>备注</th><th>时间</th></tr>${flows||'<tr><td colspan=4 class="lbl">暂无</td></tr>'}</table>
      <div class="mact" style="margin-top:14px"><button class="p" onclick="$('mask').classList.remove('on')">关闭</button></div>`;
    $('mask').classList.add('on');
  }catch(e){ alert(e.message); }
}

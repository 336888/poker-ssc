<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>五人牌桌</title>
  <link rel="stylesheet" href="./layout.css">
</head>
<body class="game">
  <header class="topbar"><a href="/">‹ 大厅</a><h1></h1><span>五人桌</span></header>
  <main class="table" aria-label="牌桌">
    <div id="away"></div>
    <div class="center"><strong id="marque"></strong><span id="pot"></span></div>
  </main>
  <section class="me">
    <div class="who"><strong id="self"></strong><span id="round"></span></div>
    <p id="status" role="status"></p>
    <div id="actions"></div>
    <div id="home" aria-label="我的手牌"></div>
  </section>
  <details><summary>本桌规则</summary><p id="rules"></p></details>
  <script type="module" src="./table.js"></script>
</body>
</html>
